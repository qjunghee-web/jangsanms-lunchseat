<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2학기 스마트 급식 지도</title>
    
    <!-- 엑셀 파싱을 위한 SheetJS 라이브러리 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <!-- 세련된 UI를 위한 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent; 
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .nav-btn.active { color: #2563eb; font-weight: bold; }
        .nav-btn { color: #6b7280; transition: all 0.2s; }
        
        /* 커스텀 모달 애니메이션 */
        #customModal { transition: opacity 0.2s; }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <header class="bg-blue-600 text-white text-center py-4 font-bold text-xl sticky top-0 z-10 shadow-md">
        2학기 스마트 급식 지도
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <!-- 1. 학생/좌석 검색 탭 -->
        <div id="tab-search" class="tab-content active space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-blue-500 pb-2 inline-block">학생 / 좌석 검색</h2>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="학번, 이름, 좌석번호" class="w-full border p-3 rounded-lg shadow-sm text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" inputmode="search" onkeypress="if(event.key==='Enter') performSearch()">
                <button onclick="performSearch()" class="bg-blue-500 text-white font-bold px-5 rounded-lg shadow hover:bg-blue-600 whitespace-nowrap">검색</button>
            </div>
            <div id="searchResult" class="mt-4 min-h-[100px]">
                <p class="text-gray-500 text-center py-10">검색어를 입력해주세요.</p>
            </div>
        </div>

        <!-- 2. 여분 좌석 탭 -->
        <div id="tab-spare" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-green-500 pb-2 inline-block">여분 좌석 조회</h2>
            <div class="flex gap-2">
                <button id="btnSpare1" onclick="showSpare('1차')" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-lg shadow transition-all border-4 border-red-600">1차 여분좌석</button>
                <button id="btnSpare2" onclick="showSpare('2차')" class="flex-1 bg-purple-500 text-white font-bold py-3 rounded-lg shadow opacity-50 transition-all border-4 border-transparent">2차 여분좌석</button>
            </div>
            <div id="spareInfoText" class="text-xs text-gray-500 italic text-center">3학년1반~10반 2학년 6반~10반</div>
            
            <div class="flex gap-2 mt-4">
                <button id="btnSpareM" onclick="filterSpare('남')" class="flex-1 border-2 border-blue-400 text-blue-600 bg-blue-50 py-2 rounded-lg font-bold transition-colors">남학생 (남)</button>
                <button id="btnSpareF" onclick="filterSpare('여')" class="flex-1 border-2 border-pink-400 text-pink-600 py-2 rounded-lg font-bold transition-colors">여학생 (여)</button>
            </div>

            <div id="spareResult" class="mt-4 grid grid-cols-4 gap-2"></div>
        </div>

        <!-- 3. 학급 급식 순서 탭 -->
        <div id="tab-order" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-indigo-500 pb-2 inline-block">학급 급식 순서</h2>
            <input type="date" id="orderDateInput" class="w-full border p-3 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="searchOrder()">
            <button onclick="searchOrder()" class="w-full bg-indigo-500 text-white font-bold py-3 rounded-lg shadow mt-2">급식 순서 검색</button>
            <div id="orderResult" class="mt-4"></div>
        </div>

        <!-- 3-2. 급식 지도 교사 탭 -->
        <div id="tab-teacher" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-teal-500 pb-2 inline-block">급식 지도 교사</h2>
            <input type="date" id="teacherDateInput" class="w-full border p-3 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500" onchange="searchTeacherOnly()">
            <button onclick="searchTeacherOnly()" class="w-full bg-teal-500 text-white font-bold py-3 rounded-lg shadow mt-2">지도 교사 검색</button>
            <div id="teacherOnlyResult" class="mt-4"></div>
        </div>

        <!-- 3-3. 식단표 탭 -->
        <div id="tab-menu" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-orange-500 pb-2 inline-block">월간 식단표</h2>
            <input type="date" id="menuDateInput" class="w-full border p-3 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="renderMenu()">
            <button onclick="renderMenu()" class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg shadow mt-2">식단 검색</button>
            <div id="menuResult" class="mt-4"></div>
        </div>

        <!-- 4. 벌점 관리 탭 (초기값 제거됨) -->
        <div id="tab-penalty" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-red-500 pb-2 inline-block">이석 위반자 벌점 부여</h2>
            <input type="date" id="penaltyDate" class="w-full border p-3 rounded-lg shadow-sm mb-2">
            <div class="flex gap-2 mb-2">
                <input type="number" id="penGrade" placeholder="학년" min="1" max="3" class="w-1/3 border p-3 rounded-lg shadow-sm text-center">
                <input type="number" id="penClass" placeholder="반" min="1" max="15" class="w-1/3 border p-3 rounded-lg shadow-sm text-center">
                <input type="number" id="penNum" placeholder="번호" min="1" max="50" class="w-1/3 border p-3 rounded-lg shadow-sm text-center">
            </div>
            <button onclick="addPenalty()" class="w-full bg-red-500 text-white font-bold py-3 rounded-lg shadow hover:bg-red-600">벌점 기록 저장</button>
            
            <h3 class="font-bold mt-6 border-b pb-2">벌점 누적 기록</h3>
            <ul id="penaltyList" class="space-y-2 mt-2 empty:after:content-['기록이_없습니다.'] empty:after:text-gray-400 empty:after:block empty:after:text-center empty:after:py-4"></ul>
        </div>

        <!-- 5. 환경 설정 탭 -->
        <div id="tab-settings" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-gray-500 pb-2 inline-block">데이터 업데이트</h2>
            <div class="bg-white p-4 rounded-lg shadow-sm border space-y-4">
                <div>
                    <label class="block font-bold text-sm mb-1 text-blue-700">1. 자리배치표 업로드 (.xlsx)</label>
                    <input type="file" id="seatFile" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div class="border-t pt-4 mt-2">
                    <label class="block font-bold text-sm mb-1 text-teal-700">2. 급식 지도 교사표 (.xlsx)</label>
                    <input type="file" id="teacherFile" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                    <p class="text-xs text-gray-400 mt-1">※ '날짜', '역할'(또는 장소), '이름'(또는 교사) 열이 포함되어야 합니다.</p>
                </div>
                <div class="border-t pt-4 mt-2">
                    <label class="block font-bold text-sm mb-1 text-orange-700">3. 월간 식단표 업로드 (.xlsx)</label>
                    <input type="file" id="menuFile" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                    <p class="text-xs text-gray-400 mt-1">※ '날짜', '식단'(또는 메뉴, 요리명) 열이 포함되어야 합니다.</p>
                </div>
            </div>
            <button onclick="requestClearData()" class="w-full border-2 border-red-500 text-red-500 font-bold py-3 rounded-lg shadow mt-6 hover:bg-red-50">모든 데이터 초기화</button>
        </div>
    </main>

    <!-- 커스텀 모달 오버레이 (alert, confirm 대체) -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-[85%] w-full mx-4 transform transition-all">
            <h3 id="modalTitle" class="font-bold text-xl mb-3 text-gray-800">알림</h3>
            <p id="modalMessage" class="text-gray-600 mb-6 leading-relaxed"></p>
            <div class="flex justify-end gap-3">
                <button id="modalBtnCancel" class="px-5 py-2.5 bg-gray-200 rounded-lg text-gray-800 hidden font-semibold hover:bg-gray-300">취소</button>
                <button id="modalBtnConfirm" class="px-5 py-2.5 bg-blue-500 rounded-lg text-white font-semibold hover:bg-blue-600 shadow">확인</button>
            </div>
        </div>
    </div>

    <!-- 토스트 메시지 컨테이너 -->
    <div id="toastContainer" class="fixed bottom-24 left-0 w-full flex flex-col items-center justify-end pointer-events-none z-50 space-y-2 px-4"></div>

    <!-- 하단 네비게이션 바 (식단 탭 추가 및 디자인 조정) -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around py-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-10 text-[0.65rem] pb-safe overflow-x-auto">
        <button onclick="switchTab('search')" id="nav-search" class="nav-btn active flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">🔍</span>검색
        </button>
        <button onclick="switchTab('spare')" id="nav-spare" class="nav-btn flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">🪑</span>여분
        </button>
        <button onclick="switchTab('order')" id="nav-order" class="nav-btn flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">📋</span>순서
        </button>
        <button onclick="switchTab('teacher')" id="nav-teacher" class="nav-btn flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">👨‍🏫</span>교사
        </button>
        <button onclick="switchTab('menu')" id="nav-menu" class="nav-btn flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">🍱</span>식단
        </button>
        <button onclick="switchTab('penalty')" id="nav-penalty" class="nav-btn flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">🚨</span>벌점
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center flex-1 min-w-[50px] py-1">
            <span class="text-lg mb-1">⚙️</span>설정
        </button>
    </nav>

    <script>
        // 전역 데이터 변수
        let seatData = JSON.parse(localStorage.getItem('smartMealSeats')) || [];
        
        let defaultTeacherData = {
            "2026-08-20": [
                { role: "1차 입구(남)", name: "김태호" },
                { role: "1차 입구(여)", name: "이유리" },
                { role: "2차 입구(남)", name: "박지성" },
                { role: "2차 입구(여)", name: "최수영" },
                { role: "잔반 지도", name: "정형돈" }
            ],
            "2026-08-21": [
                { role: "1차 입구(전체)", name: "홍길동" },
                { role: "2차 입구(전체)", name: "이순신" },
                { role: "잔반 지도", name: "유관순" }
            ]
        };
        let teacherData = JSON.parse(localStorage.getItem('smartMealTeachers'));
        if(!teacherData || Object.keys(teacherData).length === 0) {
            teacherData = defaultTeacherData;
        }

        let menuData = JSON.parse(localStorage.getItem('smartMealMenu')) || {};
        let penaltyData = JSON.parse(localStorage.getItem('smartMealPenalties')) || [];
        let currentSpareShift = '1차';
        let currentSpareGender = '남';
        const specialSeats = [208, 209, 210, 235, 236, 237, 286, 287, 288, 311, 312, 499, 500, 501, 502, 503, 504];

        // 날짜 문자열에 요일을 덧붙여 반환하는 헬퍼 함수
        function getFormattedDateWithDay(dateStr) {
            if(!dateStr) return '';
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            return `${dateStr}(${days[d.getDay()]})`;
        }

        // 앱 초기 세팅
        window.onload = function() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('orderDateInput').value = todayStr;
            document.getElementById('teacherDateInput').value = todayStr;
            document.getElementById('menuDateInput').value = todayStr;
            document.getElementById('penaltyDate').value = todayStr;
            renderPenalties();
            
            if(seatData.length === 0) {
                showToast('설정 탭에서 엑셀 데이터를 먼저 업로드해주세요.');
            }
        };

        /* --- 커스텀 모달 및 토스트 함수 --- */
        function showAlert(title, message) {
            setupModal(title, message, false);
        }

        function showConfirm(title, message, onConfirmCallback) {
            setupModal(title, message, true, onConfirmCallback);
        }

        function setupModal(title, message, isConfirm, onConfirmCallback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            const modal = document.getElementById('customModal');
            const btnCancel = document.getElementById('modalBtnCancel');
            const btnConfirm = document.getElementById('modalBtnConfirm');
            
            // 기존 이벤트 제거를 위해 노드 교체
            const newConfirm = btnConfirm.cloneNode(true);
            btnConfirm.parentNode.replaceChild(newConfirm, btnConfirm);
            
            if(isConfirm) {
                btnCancel.classList.remove('hidden');
                newConfirm.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                newConfirm.classList.add('bg-red-500', 'hover:bg-red-600');
                
                btnCancel.onclick = () => modal.classList.add('hidden');
                newConfirm.onclick = () => {
                    modal.classList.add('hidden');
                    if(onConfirmCallback) onConfirmCallback();
                };
            } else {
                btnCancel.classList.add('hidden');
                newConfirm.classList.remove('bg-red-500', 'hover:bg-red-600');
                newConfirm.classList.add('bg-blue-500', 'hover:bg-blue-600');
                
                newConfirm.onclick = () => modal.classList.add('hidden');
            }
            modal.classList.remove('hidden');
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-800 text-white px-5 py-3 rounded-full shadow-lg text-sm transition-opacity duration-300 pointer-events-auto';
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* --- 탭 전환 --- */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            if(tabId === 'spare') renderSpareSeats();
        }

        /* --- 1. 검색 기능 --- */
        function performSearch() {
            const q = document.getElementById('searchInput').value.trim();
            const resDiv = document.getElementById('searchResult');
            if(!q) return;

            if(seatData.length === 0) {
                resDiv.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg border border-red-200 text-center">데이터가 없습니다.<br>설정 탭에서 파일을 업로드해주세요.</div>`;
                return;
            }

            let results = [];
            const isNumber = /^\d+$/.test(q);
            
            if(isNumber && q.length >= 4) { // 학번 검색
                const grade = parseInt(q.substring(0,1));
                const cls = parseInt(q.substring(1,3));
                const num = parseInt(q.substring(3));
                results = seatData.filter(s => s.학년 == grade && s.반 == cls && s.번호 == num);
            } else if (isNumber && q.length < 4) { // 좌석번호 검색
                results = seatData.filter(s => s.좌석번호 == parseInt(q));
            } else { // 이름 검색
                results = seatData.filter(s => s.이름 && s.이름.includes(q));
            }

            if(results.length === 0) {
                resDiv.innerHTML = `<div class="bg-gray-50 text-gray-500 p-4 rounded-lg text-center border">검색 결과가 없습니다.</div>`;
                return;
            }

            let html = `<ul class="space-y-3">`;
            results.forEach(s => {
                let stuId = (s.학년 && s.반 && s.번호) ? `${s.학년}${String(s.반).padStart(2,'0')}${String(s.번호).padStart(2,'0')}` : '-';
                
                let content = '';
                if(isNumber && q.length >= 4) {
                    content = `<div class="text-gray-600 mt-1">이름: <span class="font-bold text-gray-900 text-lg ml-1">${s.이름 || '여분좌석'}</span></div>
                               <div class="text-gray-600 mt-1">좌석번호: <span class="font-black text-blue-600 text-2xl ml-1">${s.좌석번호}</span></div>`;
                } else if (isNumber && q.length < 4) {
                    content = `<div class="text-gray-600 mt-1">학번: <span class="font-bold text-gray-900 text-lg ml-1">${stuId}</span></div>
                               <div class="text-gray-600 mt-1">이름: <span class="font-bold text-gray-900 text-lg ml-1">${s.이름 || '여분좌석'}</span></div>`;
                } else {
                    content = `<div class="text-gray-600 mt-1">학번: <span class="font-bold text-gray-900 text-lg ml-1">${stuId}</span></div>
                               <div class="text-gray-600 mt-1">좌석번호: <span class="font-black text-blue-600 text-2xl ml-1">${s.좌석번호}</span></div>`;
                }

                html += `<li class="p-4 border rounded-xl bg-white shadow-sm relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-2 h-full ${s.차시 === '1차' ? 'bg-green-500' : 'bg-purple-500'}"></div>
                            <div class="pl-2">
                                <div class="font-black text-lg ${s.차시 === '1차' ? 'text-green-700' : 'text-purple-700'}">${s.차시} 급식</div>
                                ${content}
                            </div>
                         </li>`;
            });
            html += `</ul>`;
            resDiv.innerHTML = html;
        }

        /* --- 2. 여분 좌석 조회 기능 --- */
        function showSpare(shift) {
            currentSpareShift = shift;
            const btn1 = document.getElementById('btnSpare1');
            const btn2 = document.getElementById('btnSpare2');
            
            // 초기화
            btn1.classList.remove('opacity-50', 'border-red-600', 'border-transparent');
            btn2.classList.remove('opacity-50', 'border-red-600', 'border-transparent');
            
            if(shift === '1차') {
                btn2.classList.add('opacity-50', 'border-transparent');
                btn1.classList.add('border-red-600');
                document.getElementById('spareInfoText').innerText = "3학년1반~10반 2학년 6반~10반";
            } else {
                btn1.classList.add('opacity-50', 'border-transparent');
                btn2.classList.add('border-red-600');
                document.getElementById('spareInfoText').innerText = "2학년 1반~5반, 1학년 1반~1학년10반";
            }
            renderSpareSeats();
        }

        function filterSpare(gender) {
            currentSpareGender = gender;
            const btnM = document.getElementById('btnSpareM');
            const btnF = document.getElementById('btnSpareF');
            
            btnM.classList.remove('bg-blue-50', 'border-blue-400');
            btnM.classList.add('border-gray-300', 'text-gray-400');
            btnF.classList.remove('bg-pink-50', 'border-pink-400');
            btnF.classList.add('border-gray-300', 'text-gray-400');
            
            if(gender === '남') {
                btnM.classList.add('bg-blue-50', 'border-blue-400');
                btnM.classList.remove('border-gray-300', 'text-gray-400');
            } else {

        function parseSequence(str) {
            const parts = str.split(',').map(s => s.trim());
            let allSeqs = [];
            parts.forEach(part => {
                const cleanPart = part.replace(/\s+/g, '');
                const match = cleanPart.match(/(\d+)-(\d+)반?~(\d+)반?/);
                if(match) {
                    const grade = parseInt(match[1]);
                    const startCls = parseInt(match[2]);
                    const endCls = parseInt(match[3]);
                    
                    let minCls = 1, maxCls = 10;
                    if(grade === 3 || grade === 1) {
                        minCls = 1; maxCls = 10;
                    } else if(grade === 2) {
                        if(startCls <= 5 && endCls <= 5) {
                            minCls = 1; maxCls = 5;
                        } else if(startCls >= 6 && endCls >= 6) {
                            minCls = 6; maxCls = 10;
                        } else {
                            minCls = 1; maxCls = 10;
                        }
                    }
                    
                    let seq = [];
                    let curr = startCls;
                    let count = 0;
                    while(count < 15) {
                        seq.push(`<span class="font-bold text-gray-800 whitespace-nowrap">${grade}-${curr}반</span>`);
                        if(curr === endCls) break;
                        curr++;
                        if(curr > maxCls) curr = minCls;
                        count++;
                    }
                    allSeqs.push(seq.join(' <span class="text-indigo-400 text-sm mx-0.5">➔</span> '));
                } else {
                    allSeqs.push(`<span class="font-bold text-gray-800">${part}</span>`);
                }
            });
            return allSeqs.join('<div class="my-2 border-b border-dashed border-gray-300"></div>');
        }

        document.getElementById('seatFile').addEventListener('change', function(e) {

                    const workbook = XLSX.read(data, {type: 'array'});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
                    
                    const cleanedData = json.map(row => ({
                        차시: row['차시'] ? String(row['차시']).trim() : '',
                        구역: row['구역'] ? String(row['구역']).trim() : '',

                    showAlert('저장 완료', `자리배치표 ${cleanedData.length}개 데이터가 성공적으로 저장되었습니다.`);

        // 엑셀 업로드 처리 (급식 지도 교사표)
        document.getElementById('teacherFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    let newTeacherData = {};
                    
                    // 방법 1: 일반적인 열 제목 기반 파싱 시도 (날짜, 역할, 이름)
                    const jsonObjects = XLSX.utils.sheet_to_json(worksheet, {raw: false, dateNF: 'yyyy-mm-dd'});
                    let isObjectFormat = false;
                    
                    jsonObjects.forEach(row => {
                        let dateStr = row['날짜'] || row['일자'] || row['일시'] || '';
                        let role = row['역할'] || row['장소'] || row['지도구역'] || row['구분'] || '';
                        let name = row['이름'] || row['성명'] || row['교사명'] || row['담당자'] || row['교사'] || '';
                        
                        if (dateStr instanceof Date) {
                            dateStr = dateStr.toISOString().split('T')[0];
                        } else if (typeof dateStr === 'string') {
                            dateStr = dateStr.substring(0, 10).replace(/[\.\/]/g, '-');
                        }
                        
                        if (dateStr && name) {
                            isObjectFormat = true;
                            if(!newTeacherData[dateStr]) newTeacherData[dateStr] = [];
                            newTeacherData[dateStr].push({ name: String(name).replace(/\s+/g,''), role: String(role).trim() });
                        }
                    });
                    
                    // 방법 2: 복잡한 양식 (병합된 셀 등이 포함된 특수 양식) 파싱
                    if (!isObjectFormat) {
                        const jsonMatrix = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});
                        let currentDates = [];
                        
                        for(let i=0; i<jsonMatrix.length; i++) {
                            const row = jsonMatrix[i];
                            if(!row || row.length === 0) continue;
                            
                            const roleMatch = row.find(cell => typeof cell === 'string' && (cell.includes('점심') || cell.includes('지도') || cell.includes('입구')));
                            const role = roleMatch ? String(roleMatch).trim() : '급식지도';
                            
                            const name = row[1] ? String(row[1]).trim() : ''; 
                            
                            let rowHasDate = false;
                            let tempDates = [];
                            row.forEach(cell => {
                                if(typeof cell === 'string') {
                                    const dateMatch = cell.match(/202\d-\d{2}-\d{2}/);
                                    if(dateMatch) {
                                        tempDates.push(dateMatch[0]);
                                        rowHasDate = true;
                                    }
                                }
                            });
                            
                            if(rowHasDate) {
                                currentDates = tempDates;
                            }
                            
                            if (name && name.length >= 2 && name.length <= 5 && !rowHasDate) {
                                currentDates.forEach(date => {
                                    if(!newTeacherData[date]) newTeacherData[date] = [];
                                    newTeacherData[date].push({ name: name.replace(/\s+/g,''), role: role });
                                });
                            }
                        }
                    }
                    
                    if(Object.keys(newTeacherData).length === 0) throw new Error("유효한 교사 데이터가 없습니다.");

                    localStorage.setItem('smartMealTeachers', JSON.stringify(newTeacherData));
                    teacherData = newTeacherData;
                    showAlert('저장 완료', `교사 편성표가 성공적으로 저장되었습니다. (${Object.keys(newTeacherData).length}일치)`);
                    document.getElementById('teacherFile').value = '';
                    
                    if (document.getElementById('tab-teacher').classList.contains('active')) {
                        searchTeacherOnly();
                    }
                } catch(err) { 
                    console.error(err);
                    showAlert('오류', '파일을 읽는 중 오류가 발생했습니다.\n안내된 열 제목(날짜, 역할, 이름)이 포함되어 있는지 확인해주세요.'); 
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 엑셀 업로드 처리 (식단표)
        document.getElementById('menuFile').addEventListener('change', function(e) {
            const file = e.target.files[0];

                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, {raw: false, dateNF: 'yyyy-mm-dd'});
                    
                    let newMenuData = {};
                    
                    json.forEach(row => {
                        let dateStr = row['날짜'] || row['일자'] || row['일시'] || '';
                        let menuStr = row['식단'] || row['메뉴'] || row['요리명'] || row['중식'] || row['식단명'] || '';
                        
                        // 엑셀 날짜 보정
                        if (dateStr instanceof Date) {
                            dateStr = dateStr.toISOString().split('T')[0];
                        } else if (typeof dateStr === 'string') {
                            dateStr = dateStr.substring(0, 10).replace(/[\.\/]/g, '-');
                        }
                        
                        if (dateStr && menuStr) {
                            newMenuData[dateStr] = String(menuStr).trim();
                        }
                    });

                    if(Object.keys(newMenuData).length === 0) throw new Error("유효한 데이터가 없습니다.");

                    localStorage.setItem('smartMealMenu', JSON.stringify(newMenuData));
                    menuData = newMenuData;
                    showAlert('저장 완료', `총 ${Object.keys(newMenuData).length}일치의 식단 데이터가 저장되었습니다.`);

                    if (document.getElementById('tab-menu').classList.contains('active')) {

                } catch(err) { 
                    showAlert('오류', '파일을 읽는 중 오류가 발생했습니다. (날짜, 식단 열을 확인하세요)'); 
                }
            };
            reader.readAsArrayBuffer(file);
        });

            showConfirm(

                '저장된 모든 자리배치, 벌점 데이터를 기기에서 완전히 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.', 
                () => {
                    localStorage.clear();
                    location.reload();
                }
            );
        }
