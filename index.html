<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2학기 스마트 급식 지도</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn.active { color: #2563eb; font-weight: bold; }
        .nav-btn { color: #6b7280; transition: all 0.2s; }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <header class="bg-blue-600 text-white text-center py-4 font-bold text-xl sticky top-0 z-10 shadow-md">
        2학기 스마트 급식 지도
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <!-- 1. 검색 탭 -->
        <div id="tab-search" class="tab-content active space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-blue-500 pb-2 inline-block">학생 / 좌석 검색</h2>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="학번, 이름, 좌석번호" class="w-full border p-3 rounded-lg shadow-sm text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" inputmode="search" onkeypress="if(event.key==='Enter') performSearch()">
                <button onclick="performSearch()" class="bg-blue-500 text-white font-bold px-5 rounded-lg shadow hover:bg-blue-600 whitespace-nowrap">검색</button>
            </div>
            <div id="searchResult" class="mt-4 min-h-[100px]">
                <p class="text-gray-500 text-center py-10">검색어를 입력해주세요.</p>
            </div>
        </div>

        <!-- 2. 여분 좌석 탭 -->
        <div id="tab-spare" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-green-500 pb-2 inline-block">여분 좌석 조회</h2>
            <div class="flex gap-2">
                <!-- 1차 여분좌석 버튼에 진한 빨간색 테두리를 위한 border 클래스 준비 -->
                <button id="btnSpare1" onclick="showSpare('1차')" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-lg shadow transition-all border-4 border-red-700">1차 여분좌석</button>
                <button id="btnSpare2" onclick="showSpare('2차')" class="flex-1 bg-purple-500 text-white font-bold py-3 rounded-lg shadow opacity-50 transition-all border-4 border-transparent">2차 여분좌석</button>
            </div>
            <div id="spareInfoText" class="text-xs text-gray-500 italic text-center">3학년1반~10반 2학년 6반~10반</div>
            
            <div class="flex gap-2 mt-4">
                <button id="btnSpareM" onclick="filterSpare('남')" class="flex-1 border-2 border-blue-400 text-blue-600 bg-blue-50 py-2 rounded-lg font-bold transition-colors">남학생 (남)</button>
                <button id="btnSpareF" onclick="filterSpare('여')" class="flex-1 border-2 border-transparent text-gray-400 py-2 rounded-lg font-bold transition-colors">여학생 (여)</button>
            </div>

            <div id="spareResult" class="mt-4 grid grid-cols-4 gap-2"></div>
        </div>

        <!-- 3. 일정/교사/식단 통합 탭 -->
        <div id="tab-info" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-indigo-500 pb-2 inline-block">급식 정보 조회</h2>
            
            <input type="date" id="infoDate" class="w-full border p-3 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold" onchange="updateInfoView()">
            
            <div class="flex gap-2 mt-4 mb-2">
                <button id="btnSubSeq" onclick="switchSub('seq')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-indigo-100 text-indigo-700 border-2 border-indigo-500">학급 순서</button>
                <button id="btnSubTeacher" onclick="switchSub('teacher')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-gray-100 text-gray-600 border-2 border-transparent">지도 교사</button>
                <button id="btnSubMenu" onclick="switchSub('menu')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-gray-100 text-gray-600 border-2 border-transparent">식단표</button>
            </div>

            <div id="subViewSeq" class="mt-4"></div>
            <div id="subViewTeacher" class="mt-4 hidden"></div>
            <div id="subViewMenu" class="mt-4 hidden"></div>
        </div>

        <!-- 4. 벌점 탭 -->
        <div id="tab-penalty" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-red-500 pb-2 inline-block">이석 위반자 벌점 부여</h2>
            <input type="date" id="penaltyDate" class="w-full border p-3 rounded-lg shadow-sm mb-2 font-bold" onchange="renderPenalties()">
            <div class="flex gap-2 mb-2">
                <!-- 반 초기값 비움 -->
                <input type="number" id="penGrade" placeholder="학년" class="w-1/3 border p-3 rounded-lg shadow-sm text-center">
                <input type="number" id="penClass" placeholder="반" class="w-1/3 border p-3 rounded-lg shadow-sm text-center">
                <input type="number" id="penNum" placeholder="번호" class="w-1/3 border p-3 rounded-lg shadow-sm text-center">
            </div>
            <button onclick="addPenalty()" class="w-full bg-red-500 text-white font-bold py-3 rounded-lg shadow hover:bg-red-600">벌점 기록 저장</button>
            
            <h3 class="font-bold mt-6 border-b pb-2">벌점 누적 기록</h3>
            <ul id="penaltyList" class="space-y-2 mt-2 empty:after:content-['기록이_없습니다.'] empty:after:text-gray-400 empty:after:block empty:after:text-center empty:after:py-4"></ul>
        </div>

        <!-- 5. 설정 탭 -->
        <div id="tab-settings" class="tab-content space-y-4">
            <h2 class="font-bold text-lg border-b-2 border-gray-500 pb-2 inline-block">데이터 업데이트</h2>
            <div class="bg-white p-4 rounded-lg shadow-sm border space-y-4">
                <div>
                    <label class="block font-bold text-sm mb-1 text-blue-700">1. 학생 자리배치표 (.xlsx)</label>
                    <input type="file" id="seatFile" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 font-semibold">
                </div>
                <hr>
                <div>
                    <label class="block font-bold text-sm mb-1 text-indigo-700">2. 급식 지도 교사표 (.xlsx)</label>
                    <input type="file" id="teacherFile" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 font-semibold">
                </div>
                <hr>
                <div>
                    <label class="block font-bold text-sm mb-1 text-green-700">3. 월간 식단표 (.xlsx)</label>
                    <p class="text-xs text-gray-500 mb-1">※ '날짜', '식단'(또는 메뉴/요리명) 열이 포함되어야 합니다.</p>
                    <input type="file" id="menuFile" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-green-50 file:text-green-700 font-semibold">
                </div>
            </div>
            <button onclick="clearData()" class="w-full border-2 border-red-500 text-red-500 font-bold py-3 rounded-lg shadow mt-6 bg-white hover:bg-red-50">모든 데이터 초기화 (1학기 리셋)</button>
        </div>
    </main>

    <!-- 하단 네비게이션 -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around py-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-10 text-[0.7rem] sm:text-xs pb-safe">
        <button onclick="switchTab('search')" id="nav-search" class="nav-btn active flex flex-col items-center w-1/5 py-1">
            <span class="text-xl mb-1">🔍</span>검색
        </button>
        <button onclick="switchTab('spare')" id="nav-spare" class="nav-btn flex flex-col items-center w-1/5 py-1">
            <span class="text-xl mb-1">🪑</span>여분
        </button>
        <button onclick="switchTab('info')" id="nav-info" class="nav-btn flex flex-col items-center w-1/5 py-1">
            <span class="text-xl mb-1">📅</span>급식정보
        </button>
        <button onclick="switchTab('penalty')" id="nav-penalty" class="nav-btn flex flex-col items-center w-1/5 py-1">
            <span class="text-xl mb-1">🚨</span>벌점
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center w-1/5 py-1">
            <span class="text-xl mb-1">⚙️</span>설정
        </button>
    </nav>

    <!-- 내장 모달(Modal) UI -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 transition-opacity">
        <div class="bg-white p-6 rounded-2xl w-4/5 max-w-sm shadow-2xl transform scale-95 transition-transform" id="modalBox">
            <p id="modalMessage" class="text-gray-800 font-bold mb-6 whitespace-pre-line text-center leading-relaxed"></p>
            <div class="flex justify-center gap-3">
                <button id="modalCancelBtn" class="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hidden transition-colors hover:bg-gray-300">취소</button>
                <button id="modalOkBtn" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md transition-colors hover:bg-blue-700">확인</button>
            </div>
        </div>
    </div>

    <script>
        /* === 데이터 상태 관리 === */
        let seatData = JSON.parse(localStorage.getItem('smartMealSeats')) || [];
        let teacherData = JSON.parse(localStorage.getItem('smartMealTeachers')) || {};
        let menuData = JSON.parse(localStorage.getItem('smartMealMenu')) || {};
        let penaltyData = JSON.parse(localStorage.getItem('smartMealPenalties')) || [];
        
        let currentSpareShift = '1차';
        let currentSpareGender = '남';
        let currentInfoSub = 'seq';

        const specialSeats = [208, 209, 210, 235, 236, 237, 286, 287, 288, 311, 312, 499, 500, 501, 502, 503, 504];

        // 앱 초기화
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('infoDate').value = todayStr;
        document.getElementById('penaltyDate').value = todayStr;
        renderPenalties();

        /* === 커스텀 팝업 함수 === */
        function showAlert(msg) {
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('modalCancelBtn').classList.add('hidden');
            const modal = document.getElementById('customModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            document.getElementById('modalBox').classList.replace('scale-95', 'scale-100');
            document.getElementById('modalOkBtn').onclick = () => {
                modal.classList.add('hidden'); modal.classList.remove('flex');
                document.getElementById('modalBox').classList.replace('scale-100', 'scale-95');
            };
        }

        function showConfirm(msg, onConfirm) {
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('modalCancelBtn').classList.remove('hidden');
            const modal = document.getElementById('customModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            document.getElementById('modalBox').classList.replace('scale-95', 'scale-100');
            
            document.getElementById('modalOkBtn').onclick = () => {
                modal.classList.add('hidden'); modal.classList.remove('flex');
                document.getElementById('modalBox').classList.replace('scale-100', 'scale-95');
                onConfirm();
            };
            document.getElementById('modalCancelBtn').onclick = () => {
                modal.classList.add('hidden'); modal.classList.remove('flex');
                document.getElementById('modalBox').classList.replace('scale-100', 'scale-95');
            };
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-full shadow-lg z-50 text-sm font-bold transition-opacity duration-300';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '0', 2000);
            setTimeout(() => toast.remove(), 2300);
        }

        /* === 유틸리티: 날짜 + 요일 포맷 === */
        function formatDateWithDay(dateStr) {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if(isNaN(d)) return dateStr;
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${dateStr} (${days[d.getDay()]})`;
        }

        /* === 탭 전환 === */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            if(tabId === 'spare') renderSpareSeats();
            if(tabId === 'info') updateInfoView();
        }

        /* === 1. 학생/좌석 검색 === */
        function performSearch() {
            const q = document.getElementById('searchInput').value.trim();
            const resDiv = document.getElementById('searchResult');
            if(!q) return;

            if(seatData.length === 0) {
                resDiv.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg border text-center font-bold">자리배치표 데이터가 없습니다.<br>설정에서 엑셀 파일을 업로드해주세요.</div>`;
                return;
            }

            let results = [];
            const isNumber = /^\d+$/.test(q);
            
            if(isNumber && q.length >= 4) { // 학번
                const grade = parseInt(q.substring(0,1));
                const cls = parseInt(q.substring(1,3));
                const num = parseInt(q.substring(3));
                results = seatData.filter(s => s.학년 == grade && s.반 == cls && s.번호 == num);
            } else if (isNumber && q.length < 4) { // 좌석번호
                results = seatData.filter(s => s.좌석번호 == parseInt(q));
            } else { // 이름
                results = seatData.filter(s => s.이름 && s.이름.includes(q));
            }

            if(results.length === 0) {
                resDiv.innerHTML = `<div class="bg-gray-50 text-gray-500 p-4 rounded-lg text-center border font-bold">검색 결과가 없습니다.</div>`;
                return;
            }

            let html = `<ul class="space-y-3">`;
            results.forEach(s => {
                let stuId = (s.학년 && s.반 && s.번호) ? `${s.학년}${String(s.반).padStart(2,'0')}${String(s.번호).padStart(2,'0')}` : '-';
                // 2차 급식 경고문 삭제 완료
                let content = '';
                if(isNumber && q.length >= 4) {
                    content = `<div class="text-gray-600 mt-1">이름: <span class="font-bold text-gray-900 text-lg ml-1">${s.이름 || '여분좌석'}</span></div>
                               <div class="text-gray-600 mt-1">좌석번호: <span class="font-black text-blue-600 text-2xl ml-1">${s.좌석번호}</span></div>`;
                } else if (isNumber && q.length < 4) {
                    content = `<div class="text-gray-600 mt-1">학번: <span class="font-bold text-gray-900 text-lg ml-1">${stuId}</span></div>
                               <div class="text-gray-600 mt-1">이름: <span class="font-bold text-gray-900 text-lg ml-1">${s.이름 || '여분좌석'}</span></div>`;
                } else {
                    content = `<div class="text-gray-600 mt-1">학번: <span class="font-bold text-gray-900 text-lg ml-1">${stuId}</span></div>
                               <div class="text-gray-600 mt-1">좌석번호: <span class="font-black text-blue-600 text-2xl ml-1">${s.좌석번호}</span></div>`;
                }

                html += `<li class="p-4 border rounded-xl bg-white shadow-sm relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-2 h-full ${s.차시 === '1차' ? 'bg-green-500' : 'bg-purple-500'}"></div>
                            <div class="pl-2">
                                <div class="font-black text-lg ${s.차시 === '1차' ? 'text-green-700' : 'text-purple-700'}">${s.차시} 급식</div>
                                ${content}
                            </div>
                         </li>`;
            });
            resDiv.innerHTML = html + `</ul>`;
        }

        /* === 2. 여분 좌석 === */
        function showSpare(shift) {
            currentSpareShift = shift;
            if(shift === '1차') {
                document.getElementById('btnSpare1').classList.remove('opacity-50', 'border-transparent');
                document.getElementById('btnSpare1').classList.add('border-red-700');
                document.getElementById('btnSpare2').classList.add('opacity-50', 'border-transparent');
                document.getElementById('btnSpare2').classList.remove('border-red-700');
                document.getElementById('spareInfoText').innerText = "3학년1반~10반 2학년 6반~10반";
            } else {
                document.getElementById('btnSpare2').classList.remove('opacity-50', 'border-transparent');
                document.getElementById('btnSpare2').classList.add('border-red-700');
                document.getElementById('btnSpare1').classList.add('opacity-50', 'border-transparent');
                document.getElementById('btnSpare1').classList.remove('border-red-700');
                document.getElementById('spareInfoText').innerText = "2학년 1반~5반, 1학년 1반~10반";
            }
            renderSpareSeats();
        }

        function filterSpare(gender) {
            currentSpareGender = gender;
            document.getElementById('btnSpareM').className = `flex-1 border-2 py-2 rounded-lg font-bold transition-colors ${gender==='남'?'border-blue-400 text-blue-600 bg-blue-50':'border-transparent text-gray-400'}`;
            document.getElementById('btnSpareF').className = `flex-1 border-2 py-2 rounded-lg font-bold transition-colors ${gender==='여'?'border-pink-400 text-pink-600 bg-pink-50':'border-transparent text-gray-400'}`;
            renderSpareSeats();
        }

        function renderSpareSeats() {
            const resDiv = document.getElementById('spareResult');
            if(seatData.length === 0) { resDiv.innerHTML = `<div class="col-span-4 text-center font-bold text-red-500 py-4 text-sm">데이터를 업로드해주세요.</div>`; return; }
            
            const filtered = seatData.filter(s => s.차시 === currentSpareShift && s.구역 === currentSpareGender && (!s.이름 || s.이름.includes('여분')));
            filtered.sort((a,b) => a.좌석번호 - b.좌석번호);

            if(filtered.length === 0) { resDiv.innerHTML = `<div class="col-span-4 text-center font-bold text-gray-500 py-4 text-sm">여분 좌석이 없습니다.</div>`; return; }

            let html = '';
            filtered.forEach(s => {
                const isSpecial = specialSeats.includes(s.좌석번호);
                const bgClass = isSpecial ? 'bg-orange-500 text-white border-orange-600 shadow-md' : 'bg-white border-gray-300 text-gray-800 shadow-sm';
                const specialText = isSpecial ? `<div class="text-[0.55rem] italic mt-1 font-normal leading-tight">** 1,2차 여분</div>` : '';
                html += `<div class="border rounded-lg p-2 flex flex-col items-center justify-center font-bold h-16 ${bgClass}">
                            <span class="text-xl">${s.좌석번호}</span>${specialText}
                         </div>`;
            });
            resDiv.innerHTML = html;
        }

        /* === 3. 급식 정보 (순서/교사/식단) === */
        
        // 화살표 순서 전개 함수
        function expR(grade, start) {
            let res = [];
            let total = grade === 2 ? 5 : 10;
            let offset = grade === 2 && start >= 6 ? 5 : 0;
            let curr = start;
            for(let i=0; i<total; i++) {
                res.push(`${grade}-${curr}반`);
                curr++;
                if (grade === 2 && offset === 5 && curr > 10) curr = 6;
                else if (grade === 2 && offset === 0 && curr > 5) curr = 1;
                else if ((grade === 1 || grade === 3) && curr > 10) curr = 1;
            }
            return res.join(' ➔ ');
        }

        const schedules = [
            { start: '2026-08-18', end: '2026-08-28', t3:1, t2_1:6, t2_2:1, t1:1 },
            { start: '2026-08-31', end: '2026-09-11', t3:2, t2_1:7, t2_2:2, t1:2 },
            { start: '2026-09-14', end: '2026-09-23', t3:3, t2_1:8, t2_2:3, t1:3 },
            { start: '2026-09-28', end: '2026-10-08', t3:4, t2_1:9, t2_2:4, t1:4 },
            { start: '2026-10-12', end: '2026-10-23', t3:5, t2_1:10, t2_2:5, t1:5 },
            { start: '2026-10-26', end: '2026-11-20', t3:6, t2_1:6, t2_2:1, t1:6 }, // 10.26 그룹 고정 및 2학년 순서 수정완료
            { start: '2026-11-23', end: '2026-12-04', t3:7, t2_1:7, t2_2:2, t1:7 },
            { start: '2026-12-07', end: '2026-12-11', t3:8, t2_1:8, t2_2:3, t1:8 },
            { start: '2026-12-14', end: '2026-12-23', t3:9, t2_1:9, t2_2:4, t1:9 },
            { start: '2026-12-28', end: '2026-12-30', t3:10, t2_1:10, t2_2:5, t1:10 },
            { start: '2027-02-01', end: '2027-02-03', t3:10, t2_1:10, t2_2:5, t1:10 }
        ];

        function switchSub(sub) {
            currentInfoSub = sub;
            ['Seq', 'Teacher', 'Menu'].forEach(k => {
                let s = k.toLowerCase();
                let btn = document.getElementById('btnSub' + k);
                let view = document.getElementById('subView' + k);
                if(s === sub) {
                    btn.className = 'flex-1 py-2 rounded-lg font-bold text-sm bg-indigo-100 text-indigo-700 border-2 border-indigo-500 transition-colors';
                    view.classList.remove('hidden');
                } else {
                    btn.className = 'flex-1 py-2 rounded-lg font-bold text-sm bg-gray-100 text-gray-600 border-2 border-transparent transition-colors';
                    view.classList.add('hidden');
                }
            });
            updateInfoView();
        }

        function updateInfoView() {
            const d = document.getElementById('infoDate').value;
            if(!d) return;
            const formattedD = formatDateWithDay(d);

            // 1. 순서
            if(currentInfoSub === 'seq') {
                const sMatch = schedules.find(s => d >= s.start && d <= s.end);
                let html = `<h3 class="font-bold text-lg mb-3 text-indigo-800">${formattedD} 급식 순서</h3>`;
                if(sMatch) {
                    html += `
                        <div class="space-y-4">
                            <div class="bg-green-50 p-4 rounded-xl border border-green-200 shadow-sm">
                                <div class="font-black text-green-700 mb-2 border-b border-green-200 pb-1">1차 급식 (12:20)</div>
                                <div class="text-sm font-bold text-gray-700 leading-relaxed break-keep tracking-tight">
                                    [3학년] <span class="text-indigo-600">${expR(3, sMatch.t3)}</span><br><br>
                                    [2학년] <span class="text-blue-600">${expR(2, sMatch.t2_1)}</span>
                                </div>
                            </div>
                            <div class="bg-purple-50 p-4 rounded-xl border border-purple-200 shadow-sm">
                                <div class="font-black text-purple-700 mb-2 border-b border-purple-200 pb-1">2차 급식 (12:40)</div>
                                <div class="text-sm font-bold text-gray-700 leading-relaxed break-keep tracking-tight">
                                    [2학년] <span class="text-blue-600">${expR(2, sMatch.t2_2)}</span><br><br>
                                    [1학년] <span class="text-pink-600">${expR(1, sMatch.t1)}</span>
                                </div>
                            </div>
                        </div>`;
                } else { html += `<div class="bg-gray-50 text-gray-500 p-4 rounded-lg text-center border font-bold">해당 날짜의 순서 정보가 없습니다.</div>`; }
                document.getElementById('subViewSeq').innerHTML = html;
            }
            
            // 2. 교사
            if(currentInfoSub === 'teacher') {
                const teachers = teacherData[d];
                let html = `<h3 class="font-bold text-lg mb-3 text-blue-800">${formattedD} 지도 교사</h3>`;
                if(!teachers || teachers.length === 0) {
                    html += `<div class="bg-gray-50 text-gray-500 p-4 rounded-lg text-center border font-bold">데이터가 없습니다.<br>설정 탭에서 교사표를 업로드해주세요.</div>`;
                } else {
                    html += `<ul class="space-y-3">`;
                    teachers.forEach(t => {
                        html += `<li class="flex justify-between items-center bg-white p-3 border rounded-lg shadow-sm">
                                    <span class="text-sm text-gray-600 font-bold">${t.role}</span>
                                    <span class="font-black text-lg text-blue-700">${t.name} 교사</span>
                                 </li>`;
                    });
                    html += `</ul>`;
                }
                document.getElementById('subViewTeacher').innerHTML = html;
            }

            // 3. 식단
            if(currentInfoSub === 'menu') {
                const menu = menuData[d];
                let html = `<h3 class="font-bold text-lg mb-3 text-green-800">${formattedD} 식단표</h3>`;
                if(!menu) {
                    html += `<div class="bg-gray-50 text-gray-500 p-4 rounded-lg text-center border font-bold">데이터가 없습니다.<br>설정 탭에서 식단표를 업로드해주세요.</div>`;
                } else {
                    html += `<div class="bg-white p-6 border-2 border-green-200 rounded-xl shadow-md text-center font-bold text-gray-800 text-lg leading-relaxed whitespace-pre-line">${menu}</div>`;
                }
                document.getElementById('subViewMenu').innerHTML = html;
            }
        }

        /* === 4. 벌점 === */
        function addPenalty() {
            const date = document.getElementById('penaltyDate').value;
            const grade = document.getElementById('penGrade').value;
            const cls = document.getElementById('penClass').value;
            const num = document.getElementById('penNum').value;
            
            if(!date || !grade || !cls || !num) { showAlert('학년, 반, 번호를 모두 입력해주세요.'); return; }
            
            const record = { id: Date.now(), date: date, grade: grade, cls: cls, num: num, 
                             stuId: `${grade}${String(cls).padStart(2,'0')}${String(num).padStart(2,'0')}` };
            
            penaltyData.push(record);
            localStorage.setItem('smartMealPenalties', JSON.stringify(penaltyData));
            showToast('✅ 벌점이 저장되었습니다.');
            renderPenalties();
            document.getElementById('penNum').value = '';
        }

        function deletePenalty(id) {
            showConfirm('해당 벌점 기록을 삭제하시겠습니까?', () => {
                penaltyData = penaltyData.filter(p => p.id !== id);
                localStorage.setItem('smartMealPenalties', JSON.stringify(penaltyData));
                renderPenalties();
                showToast('삭제 완료');
            });
        }

        function renderPenalties() {
            const list = document.getElementById('penaltyList');
            const targetDate = document.getElementById('penaltyDate').value;
            list.innerHTML = '';
            
            // 선택한 날짜에 해당하는 기록만 표시
            const filtered = penaltyData.filter(p => p.date === targetDate).sort((a,b) => b.id - a.id);
            
            filtered.forEach(p => {
                list.innerHTML += `<li class="flex justify-between items-center p-3 border-l-4 border-red-500 rounded-r-lg bg-white shadow-sm mb-2">
                    <div>
                        <div class="text-xs text-gray-500 font-bold mb-1">${formatDateWithDay(p.date)}</div>
                        <div class="text-gray-800 font-black tracking-wide">${p.stuId} <span class="text-red-600 ml-1 text-sm font-bold">(${p.grade}학년 ${p.cls}반 ${p.num}번)</span></div>
                    </div>
                    <button onclick="deletePenalty(${p.id})" class="text-xs bg-gray-100 font-bold text-gray-600 px-3 py-2 rounded-lg hover:bg-gray-200 border">삭제</button>
                </li>`;
            });
        }

        /* === 5. 엑셀 업로드 === */
        
        // 자리배치표
        document.getElementById('seatFile').addEventListener('change', function(e) {
            if(!e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const json = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type: 'array'}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type: 'array'}).SheetNames[0]], {defval: ""});
                    const cleaned = json.map(r => ({
                        차시: String(r['차시']||'').trim(), 구역: String(r['구역']||'').trim(),
                        학년: parseInt(r['학년'])||'', 반: parseInt(r['반'])||'', 번호: parseInt(r['번호'])||'',
                        이름: String(r['이름']||'').trim(), 좌석번호: parseInt(r['좌석번호'])||0
                    })).filter(r => r.좌석번호 > 0);
                    localStorage.setItem('smartMealSeats', JSON.stringify(cleaned));
                    seatData = cleaned;
                    showAlert(`✅ 자리배치표 ${cleaned.length}건이 저장되었습니다.`);
                    document.getElementById('seatFile').value = '';
                } catch(err) { showAlert('엑셀 오류 (자리배치표)'); }
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        // 지도 교사표 (강화된 자동 인식)
        document.getElementById('teacherFile').addEventListener('change', function(e) {
            if(!e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const json = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: true}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: true}).SheetNames[0]], {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});
                    let newData = {};
                    let savedDates = [];
                    
                    for(let i=1; i<json.length; i++) {
                        const row = json[i];
                        if(!row || row.length === 0) continue;
                        
                        let role = ''; let name = row[1] || '';
                        for(let c of row) { if(typeof c==='string' && c.includes('점심시간')) { role = c; break; } }
                        
                        let foundDates = [];
                        row.forEach(c => { if(typeof c==='string' && c.match(/^202\d-\d{2}-\d{2}/)) foundDates.push(c.substring(0,10)); });
                        if(foundDates.length > 0) savedDates = foundDates;
                        
                        if(name && role && savedDates.length > 0) {
                            savedDates.forEach(d => {
                                if(!newData[d]) newData[d] = [];
                                newData[d].push({ name: name.replace(/\s+/g,''), role: role.trim() });
                            });
                        }
                    }
                    localStorage.setItem('smartMealTeachers', JSON.stringify(newData));
                    teacherData = newData;
                    showAlert(`✅ 급식 지도 교사표가 저장되었습니다.\n(${Object.keys(newData).length}일치)`);
                    document.getElementById('teacherFile').value = '';
                } catch(err) { showAlert('엑셀 오류 (교사표)'); }
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        // 월간 식단표
        document.getElementById('menuFile').addEventListener('change', function(e) {
            if(!e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const json = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: true}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: true}).SheetNames[0]], {raw: false, dateNF: 'yyyy-mm-dd'});
                    let newData = {};
                    json.forEach(row => {
                        let dKey = row['날짜'] ? String(row['날짜']).substring(0,10) : '';
                        let text = row['식단'] || row['메뉴'] || row['요리명'] || '';
                        if(dKey && text) newData[dKey] = text.replace(/\n/g, '\n');
                    });
                    localStorage.setItem('smartMealMenu', JSON.stringify(newData));
                    menuData = newData;
                    showAlert(`✅ 식단표 데이터가 저장되었습니다.\n(${Object.keys(newData).length}일치)`);
                    document.getElementById('menuFile').value = '';
                } catch(err) { showAlert('엑셀 오류 (식단표)'); }
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function clearData() {
            showConfirm('스마트폰에 저장된 자리배치, 교사, 식단, 벌점 데이터를 모두 삭제하시겠습니까?\n(1학기 데이터 리셋 시 사용)', () => {
                localStorage.clear();
                showToast('완전히 초기화되었습니다.');
                setTimeout(() => location.reload(), 1500);
            });
        }
    </script>
</body>
</html>
